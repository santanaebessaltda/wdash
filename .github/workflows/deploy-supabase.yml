name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
      - .github/workflows/deploy-supabase.yml
  workflow_dispatch:

concurrency:
  group: supabase-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: gjdslociicdkmjxxznyf
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database
        run: supabase db push --yes

      - name: Deploy Edge Functions
        run: supabase functions deploy

      - name: Remove document files
        run: |
          set -euo pipefail
          keys=$(curl -fsS "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
          service=$(KEYS_JSON="$keys" node --input-type=module -e 'const rows=JSON.parse(process.env.KEYS_JSON); const row=rows.find((item)=>item.name==="service_role"); if(!row?.api_key?.startsWith("eyJ")) process.exit(2); process.stdout.write(row.api_key);')
          echo "::add-mask::$service"
          base="https://${SUPABASE_PROJECT_ID}.supabase.co/storage/v1/bucket/documents"
          empty=$(curl -s -o /tmp/storage-empty.txt -w "%{http_code}" -X POST "$base/empty" \
            -H "Authorization: Bearer ${service}" -H "apikey: ${service}")
          if [ "$empty" != "200" ] && [ "$empty" != "404" ] && [ "$empty" != "400" ]; then
            echo "failed to empty documents bucket (${empty})"
            cat /tmp/storage-empty.txt
            exit 1
          fi
          if [ "$empty" = "400" ]; then
            echo "documents bucket already gone (${empty})"
            cat /tmp/storage-empty.txt
          fi
          code=$(curl -s -o /tmp/storage-bucket.txt -w "%{http_code}" -X DELETE "$base" \
            -H "Authorization: Bearer ${service}" -H "apikey: ${service}")
          if [ "$code" != "200" ] && [ "$code" != "404" ] && [ "$code" != "400" ]; then
            echo "failed to delete documents bucket (${code})"
            cat /tmp/storage-bucket.txt
            exit 1
          fi

      - name: Remove document functions
        run: |
          for name in documents assina-webhook assina-credential-persist; do
            code=$(curl -s -o /tmp/fn-delete.txt -w "%{http_code}" -X DELETE \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/functions/${name}" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")
            if [ "$code" != "200" ] && [ "$code" != "404" ]; then
              echo "failed to delete ${name} (${code})"
              exit 1
            fi
          done
