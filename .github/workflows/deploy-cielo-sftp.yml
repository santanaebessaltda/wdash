name: Deploy Cielo SFTP

on:
  push:
    branches: [main]
    paths:
      - workers/cielo-sftp/**
      - .github/workflows/deploy-cielo-sftp.yml
  workflow_dispatch:

concurrency:
  group: fly-cielo-sftp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      - name: Deploy
        working-directory: workers/cielo-sftp
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false
