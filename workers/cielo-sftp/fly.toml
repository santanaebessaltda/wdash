# SFTP da Cielo (fluxo PUT). Uma máquina em gru, TCP 2222, IPv4 dedicado.
# Credenciais: fly secrets. Sem senha no git.
# Imagem pública (sem build local) — a rede corporativa bloqueia o builder remoto do Fly.
# Dockerfile + entrypoint.sh ficam no repo para deploy via GitHub Actions quando quisermos
# host keys persistentes e SFTP_USER/SFTP_PASSWORD separados.
app = "wdash-cielo-sftp"
primary_region = "gru"

[build]
  image = "atmoz/sftp:alpine"

# atmoz cria /home/cielo e a pasta inbox; o volume grava os arquivos da Cielo.
[[mounts]]
  source = "cielo_inbox"
  destination = "/home/cielo/inbox"

[[services]]
  protocol = "tcp"
  internal_port = 22
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 2222

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

kill_timeout = 10
