# Worker do Millennium. Uma máquina só (fly scale count 1), região gru:
# duas máquinas brigam pela mesma sessão Millennium / pelo mesmo sync_job.
app = "wdash-millennium-sync"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  # Host do Millennium (:6017) não fala TLS (HTTPS falha no handshake). Trocar o esquema derruba o sync.
  MILLENNIUM_API_BASE = "http://177.85.160.35:6017/api"
  SYNC_ONBOARDING = "2m"
  AUTO_REFRESH = "on"
  CLOSE_HOUR = "2"
  DEEP_HISTORY = "24m"

[processes]
  worker = "./node_modules/.bin/tsx src/index.ts"

# O mesmo processo escuta o aviso do PIX. STONE_WEBHOOK_TOKEN e
# STONE_WEBHOOK_PUBLIC_URL ficam no secret do Fly, não aqui.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["worker"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]

kill_timeout = 30
